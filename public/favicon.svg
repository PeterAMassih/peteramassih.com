    <rect class="cell"  x="15" y="3"  width="6" height="6"/>
    <rect class="cell"  x="3"  y="9"  width="6" height="6"/>
    <rect class="cell"  x="9"  y="9"  width="6" height="6"/>
    <rect class="cell"  x="15" y="9"  width="6" height="6"/>
    <rect class="cell"  x="3"  y="15" width="6" height="6"/>
    <rect class="cell"  x="9"  y="15" width="6" height="6"/>
    <rect class="patch" x="15" y="15" width="6" height="6"/>
  </g>
